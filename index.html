<title>NutriPilot Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: demo toolbar on top; phone frame (or full desktop app) centered beside a scenario guide. App = sidebar/bottom-nav shell + scrolling main. */
:root{
  --bg:#F4F7F3; --surface:#FFFFFF; --surface-2:#EDF2EC; --surface-3:#E3EAE2; --line:#DEE6DC;
  --ink:#16201A; --ink-2:#56625A; --ink-3:#86918A;
  --brand:#0C9A68; --brand-ink:#08734E; --brand-soft:#E1F4EA; --on-brand:#FFFFFF;
  --lime:#B9E35A; --lime-soft:#F0F8DC;
  --ready:#2F6BC9; --ready-soft:#E6EEFA;
  --warn:#B86E0A; --warn-soft:#FCF0DB; --err:#C8443A; --err-soft:#FBE7E5; --info:#2F6BC9; --info-soft:#E6EEFA;
  --frame:#1B231E; --scrim:rgba(14,22,17,.42);
  --shadow-1:0 1px 2px rgba(20,40,28,.06),0 1px 1px rgba(20,40,28,.04);
  --shadow-2:0 6px 20px rgba(20,40,28,.08),0 2px 6px rgba(20,40,28,.05);
  --shadow-3:0 18px 50px rgba(20,40,28,.18);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px;
  --f-display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#18201B; --surface-2:#1F2923; --surface-3:#28332C; --line:#2C3830;
  --ink:#ECF2ED; --ink-2:#A8B4AC; --ink-3:#77837B;
  --brand:#2DC48C; --brand-ink:#5ED9A8; --brand-soft:#173527; --on-brand:#06140D;
  --lime:#B9E35A; --lime-soft:#26301A; --ready:#7EA8F0; --ready-soft:#1B2840;
  --warn:#EAAA4C; --warn-soft:#352914; --err:#F07D72; --err-soft:#3A1E1B; --info:#7EA8F0; --info-soft:#1B2840;
  --frame:#000; --scrim:rgba(0,0,0,.6);
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 6px 20px rgba(0,0,0,.4); --shadow-3:0 18px 50px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18201B; --surface-2:#1F2923; --surface-3:#28332C; --line:#2C3830;
  --ink:#ECF2ED; --ink-2:#A8B4AC; --ink-3:#77837B;
  --brand:#2DC48C; --brand-ink:#5ED9A8; --brand-soft:#173527; --on-brand:#06140D;
  --lime:#B9E35A; --lime-soft:#26301A; --ready:#7EA8F0; --ready-soft:#1B2840;
  --warn:#EAAA4C; --warn-soft:#352914; --err:#F07D72; --err-soft:#3A1E1B; --info:#7EA8F0; --info-soft:#1B2840;
  --frame:#000; --scrim:rgba(0,0,0,.6);
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 6px 20px rgba(0,0,0,.4); --shadow-3:0 18px 50px rgba(0,0,0,.6);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== Demo chrome ===== */
.demobar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demobar .brandline{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:16px}
.demobar .tag{font-family:var(--f-body);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.demobar .grow{flex:1}
.dseg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.dseg button{padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.dseg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.dseg svg.i{width:16px;height:16px}
.dsel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:13px;max-width:240px}
.dbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.dbtn:hover{background:var(--surface-2)}
.dtoggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.stage{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.guide{width:320px;flex:none;position:sticky;top:78px;max-height:calc(100vh - 100px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.guide h2{font-size:20px}
.guide .lede{color:var(--ink-2);font-size:13px}
.scn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:12px 14px}
.scn.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.scn .top{display:flex;align-items:center;gap:10px}
.scn .letter{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.scn.on .letter{background:var(--brand);color:var(--on-brand)}
.scn .t{font-weight:600;flex:1;font-size:13.5px}
.scn ol{margin:10px 0 2px;padding-left:20px;color:var(--ink-2);font-size:12.5px;display:grid;gap:3px}
.clock{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.device{position:relative;flex:none;overflow:hidden;background:var(--bg)}
.device.mobile{width:390px;height:min(844px,calc(100vh - 110px));min-height:640px;border-radius:48px;border:11px solid var(--frame);box-shadow:var(--shadow-3)}
.device.desktop{width:min(1320px,100%);height:calc(100vh - 104px);min-height:620px;border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow-2)}
.drawer-scrim{position:fixed;inset:0;background:var(--scrim);z-index:60}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(360px,92vw);background:var(--bg);z-index:61;padding:20px 16px;overflow:auto;box-shadow:var(--shadow-3)}
.fab-demo{position:fixed;z-index:55;right:calc(12px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;box-shadow:var(--shadow-2);opacity:.88}
body.narrow .demobar,body.narrow .guide{display:none}
body.narrow .stage{padding:0}
body.narrow .device{width:100vw;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}

/* ===== App shell ===== */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.app-main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scroll-behavior:auto}
.sbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font-weight:700;font-size:14px;background:var(--bg)}
.sbar .dots{display:flex;gap:5px;align-items:center}
.sbar .dots i{display:block;width:4px;border-radius:1px;background:var(--ink)}
body.narrow .sbar{display:none}
.bnav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(10px + env(safe-area-inset-bottom,0px))}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);padding:6px 0}
.bnav button.on{color:var(--brand-ink)}
.bnav .ai{position:relative;top:-14px}
.bnav .ai .orb{width:52px;height:52px;border-radius:18px;background:var(--ink);color:var(--lime);display:grid;place-items:center;box-shadow:var(--shadow-2)}
.bnav .ai.on .orb{background:var(--brand);color:var(--on-brand)}
.bnav .ai span{margin-top:-2px}
.app.desk{flex-direction:row}
.side{width:248px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:4px;overflow:auto}
.side .logo{display:flex;gap:10px;align-items:center;font-family:var(--f-display);font-weight:700;font-size:19px;padding:4px 8px 18px}
.side .nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-weight:600;color:var(--ink-2);text-align:left}
.side .nav:hover{background:var(--surface-2)}
.side .nav.on{background:var(--brand-soft);color:var(--brand-ink)}
.side .nav.aibtn{background:var(--ink);color:var(--bg);margin:6px 0}
.side .nav.aibtn svg{color:var(--lime)}
.side .nav.aibtn.on{background:var(--brand);color:var(--on-brand)}
.side .sep{height:1px;background:var(--line);margin:12px 6px}
.side .mini{font-size:12px;color:var(--ink-2);padding:0 8px;display:grid;gap:8px}
.side .who{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px 8px;border-top:1px solid var(--line)}
.avatar{width:36px;height:36px;border-radius:12px;background:var(--lime-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;flex:none}

/* ===== Page scaffolding ===== */
.hdr{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 16px;min-height:56px}
.hdr h1{font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sub{font-size:12px;color:var(--ink-3);font-family:var(--f-body);font-weight:500;letter-spacing:0}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}
.page{padding:4px 16px 28px;display:flex;flex-direction:column;gap:18px}
.app.desk .hdr{padding:22px 32px 10px;background:var(--bg)}
.app.desk .hdr h1{font-size:26px}
.app.desk .page{padding:8px 32px 40px;max-width:1180px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-size:16px}
.sec-h .lnk{font-size:13px;font-weight:600;color:var(--brand-ink)}
.lnk{color:var(--brand-ink);font-weight:600}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:12px} .xs{font-size:11px}
.row{display:flex;align-items:center;gap:10px} .row.wrap{flex-wrap:wrap} .grow{flex:1;min-width:0} .between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.app.desk .dgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}
.app.desk .dgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card.flat{box-shadow:none}
.card.tight{padding:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.divider{height:1px;background:var(--line)}
.sample{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);border:1px dashed var(--line);border-radius:6px;padding:1px 6px}

/* ===== Components ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:14px;font-weight:700;font-size:15px;transition:transform .08s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.secondary{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.secondary:hover{background:var(--surface-2)}
.btn.ghost{color:var(--brand-ink);height:40px;padding:0 10px}
.btn.danger{background:var(--err-soft);color:var(--err)}
.btn.sm{height:36px;padding:0 14px;font-size:13px;border-radius:11px}
.btn.xs{height:30px;padding:0 10px;font-size:12px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled],.btn.disabled{opacity:.45;pointer-events:none}
.btn.loading{pointer-events:none;opacity:.85}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--ink-2)}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.chip.allergy.on{background:var(--err-soft);border-color:var(--err);color:var(--err)}
.chip.sm{height:30px;padding:0 11px;font-size:12px}
.chip svg.i{width:15px;height:15px}
.scard{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface)}
.scard:hover{border-color:var(--ink-3)}
.scard.on{border-color:var(--brand);background:var(--brand-soft)}
.scard .ico{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.scard.on .ico{background:var(--brand);color:var(--on-brand)}
.scard .t{font-weight:700;font-size:14.5px}
.scard .d{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.scard .radio{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.scard.on .radio{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
.scard.on .radio svg{width:12px;height:12px;stroke-width:3}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.input{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;width:100%;font-size:15px}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.input.err{border-color:var(--err)}
.input[disabled]{background:var(--surface-2);color:var(--ink-3)}
.hint{font-size:12px;color:var(--ink-3)} .hint.err{color:var(--err)}
.affix{position:relative}
.affix .pre,.affix .suf{position:absolute;top:50%;transform:translateY(-50%);font-weight:700;color:var(--ink-3);font-size:14px}
.affix .pre{left:14px} .affix .suf{right:14px}
.affix .input.has-pre{padding-left:52px}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:38px;border-radius:10px;font-weight:600;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.switch{width:46px;height:28px;border-radius:999px;background:var(--surface-3);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:var(--shadow-1);transition:left .15s}
.switch.on{background:var(--brand)} .switch.on::after{left:21px}
input[type=range]{width:100%;accent-color:var(--brand);height:28px}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:7px;font-size:11px;font-weight:700;white-space:nowrap}
.badge svg.i{width:13px;height:13px;stroke-width:2.2}
.b-brand{background:var(--brand-soft);color:var(--brand-ink)}
.b-ready{background:var(--ready-soft);color:var(--ready)}
.b-info{background:var(--info-soft);color:var(--info)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-err{background:var(--err-soft);color:var(--err)}
.b-muted{background:var(--surface-2);color:var(--ink-2)}
.b-outline{border:1px solid var(--line);color:var(--ink-2)}
.b-lime{background:var(--lime-soft);color:var(--brand-ink)}
.callout{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-md);font-size:13px;align-items:flex-start}
.callout svg.i{margin-top:1px}
.callout.info{background:var(--info-soft);color:var(--ink)} .callout.info svg{color:var(--info)}
.callout.warn{background:var(--warn-soft);color:var(--ink)} .callout.warn svg{color:var(--warn)}
.callout.err{background:var(--err-soft);color:var(--ink)} .callout.err svg{color:var(--err)}
.callout.ok{background:var(--brand-soft);color:var(--ink)} .callout.ok svg{color:var(--brand)}
.callout.plain{background:var(--surface-2);color:var(--ink-2)}
.callout b{font-weight:700}
.bar{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden;display:flex}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:999px}
.bar.warn>i{background:var(--warn)}
.bar.split>i{border-radius:0}
.bar.split>i:first-child{border-radius:999px 0 0 999px}
.art{display:block;width:100%;height:100%}
.thumb{width:64px;height:64px;border-radius:14px;overflow:hidden;flex:none;background:var(--surface-2)}
.thumb.lg{width:84px;height:84px}
.thumb.sm{width:44px;height:44px;border-radius:11px}

/* meal card */
.mcard{display:flex;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;text-align:left;width:100%;position:relative}
.mcard:hover{border-color:var(--ink-3)}
.mcard .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding:2px 0}
.mcard .slot{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.mcard .name{font-weight:700;font-size:14.5px;line-height:1.25}
.mcard .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.mcard .meta span{display:inline-flex;gap:4px;align-items:center}
.mcard .meta svg.i{width:14px;height:14px}
.mcard .foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.mcard.ready{box-shadow:inset 3px 0 0 var(--ready)}
.mcard.home{box-shadow:inset 3px 0 0 var(--brand)}
.mcard.skipped{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 10px,var(--surface-2) 10px,var(--surface-2) 20px);box-shadow:none}
.mcard.skipped .name{text-decoration:line-through;color:var(--ink-3)}
.mcard.skipped .thumb{opacity:.35;filter:grayscale(1)}
.mcard.done .thumb{position:relative}
.mcard.done .thumb::after{content:"";position:absolute;inset:0;background:rgba(12,154,104,.35)}
.mcard .tick{position:absolute;left:44px;top:42px;width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;border:2px solid var(--surface)}
.mcard .tick svg{width:13px;height:13px;stroke-width:3}

/* nutrition */
.ringwrap{position:relative;width:118px;height:118px;flex:none}
.ringwrap .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}

/* Illustrated "food photography" stand-in: top-down bowl generated per dish */
function art(key,pal){
  let h=hash(key)||1;const rnd=()=>{h=(Math.imul(h,1103515245)+12345)>>>0;return (h%10000)/10000};
  const n=pal.length;let s=`<svg viewBox="0 0 100 100" class="art" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="100" height="100" fill="${pal[0]}"/>`;
  s+=`<circle cx="53" cy="55" r="41" fill="rgba(0,0,0,.10)"/><circle cx="50" cy="50" r="41" fill="#FBFBF8"/><circle cx="50" cy="50" r="34" fill="${pal[1]}"/>`;
  const segs=n-2;let a=rnd()*6.28;const step=6.28/(segs+1);
  for(let i=0;i<segs;i++){const a1=a+step*(i+1)*0.92+i*0.08,a2=a1+step*0.95;const r=34;
    const x1=50+r*Math.cos(a1),y1=50+r*Math.sin(a1),x2=50+r*Math.cos(a2),y2=50+r*Math.sin(a2);
    s+=`<path d="M50 50L${x1.toFixed(1)} ${y1.toFixed(1)}A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}Z" fill="${pal[i+2]}"/>`;}
  s+=`<circle cx="50" cy="50" r="${9+rnd()*4}" fill="${pal[n-1]}" opacity=".95"/>`;
  for(let i=0;i<9;i++){const ang=rnd()*6.28,rr=8+rnd()*22;s+=`<circle cx="${(50+rr*Math.cos(ang)).toFixed(1)}" cy="${(50+rr*Math.sin(ang)).toFixed(1)}" r="${(1+rnd()*1.8).toFixed(1)}" fill="${i%2?'#FFFFFF':pal[2]}" opacity=".85"/>`}
  return s+'</svg>';
}

/* ================= Compatibility (allergies are hard rules) ================= */
function compatible(item){const u=S.user;if((item.al||[]).some(a=>u.allergies.includes(a)))return false;
 const m=item.meat;if(u.diet==='Vegetarian'&&m)return false;if(u.diet==='Vegan'&&(m||(item.al||[]).some(a=>a==='Dairy'||a==='Eggs')))return false;
 if(u.diet==='Pescatarian'&&m&&m!=='fish')return false;
 if(m==='chicken'&&!u.meats.includes('Chicken'))return false;if(m==='fish'&&!u.meats.includes('Fish')&&!u.meats.includes('Seafood'))return false;return true}
function slotGroup(slot){return slot==='breakfast'?'breakfast':slot==='snack'?'snack':'main'}
function homeOptions(slot){return Object.keys(R).filter(k=>R[k].slot===slotGroup(slot)&&compatible(R[k]))}
function dishOptions(){return Object.keys(D).filter(k=>compatible(D[k]))}

/* ================= Plan generation ================= */
function genPlan(){const cfg=S.planCfg,u=S.user;let days=cfg.duration==='custom'?Math.max(1,Math.min(30,Math.round((new Date(cfg.end)-new Date(cfg.start))/864e5)+1)):cfg.duration;
 const meals=[];for(let d=0;d<days;d++){TEMPLATE[d%7].forEach(([slot,kind,ref])=>{if(!cfg.meals.includes(slot))return;
  let mode=kind==='h'?'home':'ready';
  if(u.method==='home')mode='home';
  if(u.method==='ready'&&(slot==='lunch'||slot==='dinner'))mode='ready';
  if(mode==='ready'&&kind==='h')ref=['salad','tikka','shawarmabowl','falafel','moilee','mixedgrill','adobo'][(d+(slot==='dinner'?3:0))%7];
  if(mode==='home'&&kind==='r')ref=['salmon','chickenbowl','lentil','skillet','fishcurry','lemonchicken','chickpea'][(d+(slot==='dinner'?2:0))%7];
  const item=mode==='home'?R[ref]:D[ref];
  if(!compatible(item)){const opts=mode==='home'?homeOptions(slot):dishOptions();if(!opts.length&&mode==='ready'){mode='home'}const o2=mode==='home'?homeOptions(slot):opts;if(!o2.length)return;ref=o2[(d+SLOTS.indexOf(slot))%o2.length]}
  meals.push({id:`d${d}-${slot}`,day:d,slot,mode,ref,status:'pending',servings:1,time:u.times[slot],order:null})})}
 return{title:days===7?'Balanced Week':days===14?'Balanced Fortnight':'Balanced Month',num:3,start:cfg.start,days,status:'draft',meals}}
function batchOf(day){return day<1?null:'b'+Math.ceil(day/3)}
function batchDays(b){const n=+b.slice(1);return[(n-1)*3+1,Math.min(n*3,S.plan.days-1)]}
function batches(){const s=new Set();S.plan.meals.forEach(m=>{const b=batchOf(m.day);if(b)s.add(b)});return[...s].sort((a,b)=>+a.slice(1)-+b.slice(1))}
function batchLocked(b){return['delivered','confirmed','processing'].includes((S.gorders[b]||{}).status)}
function batchSlot(b){return S.slots[b]||S.sched.grocerySlot}
function batchLabel(b){const[a]=batchDays(b);return `${dShort(a)} · ${batchSlot(b)}`}
function needsFor(filter){const out={};S.plan.meals.forEach(m=>{if(m.mode!=='home'||m.status==='skipped'||!filter(m))return;
 R[m.ref].ings.forEach(([i,q])=>{out[i]=out[i]||{qty:0,meals:[]};out[i].qty+=q*(m.servings||1);out[i].meals.push(m.id)})});return out}
function openMealFilter(m){return m.status!=='completed'&&m.day>=1&&!batchLocked(batchOf(m.day))}
function batchLines(b){const needs=needsFor(m=>batchOf(m.day)===b&&m.status!=='completed');const lines=[];
 Object.entries(needs).forEach(([ing,v])=>{if(S.pantry.includes(ing)||S.removed.includes(ing))return;const p=prodFor(ing);
  const auto=Math.max(1,Math.ceil(v.qty/p.size-1e-9));const packs=Math.max(0,auto+(S.packAdj[b+':'+ing]||0));lines.push({ing,need:v.qty,meals:v.meals,p,auto,packs,cost:packs*p.price,subbed:INGS[ing].prods[0].out&&S.prodChoice[ing]==null||(INGS[ing].prods[0].out&&S.prodChoice[ing]!=null)})});
 return lines.sort((a,b2)=>INGS[a.ing].cat.localeCompare(INGS[b2.ing].cat))}
function batchTotal(b){if(batchLocked(b)&&S.purchased[b])return S.purchased[b].total;const l=batchLines(b);const sub=l.reduce((a,x)=>a+x.cost,0);return sub?sub+(sub>=150?0:7):0}
function groceryTotal(){return batches().reduce((a,b)=>a+batchTotal(b),0)+S.topups.filter(t=>t.status!=='cancelled').reduce((a,t)=>a+t.price,0)}
function leftover(ing,b,exclude){const bought=(S.purchased[b]&&S.purchased[b].qty[ing])||0;let used=0;
 S.plan.meals.forEach(m=>{if(m.id===exclude||m.mode!=='home'||m.status==='skipped'||batchOf(m.day)!==b)return;R[m.ref].ings.forEach(([i,q])=>{if(i===ing)used+=q*(m.servings||1)})});return bought-used}
function missingFor(nm){const b=batchOf(nm.day);const miss=[];R[nm.ref].ings.forEach(([i,q])=>{q*=nm.servings||1;if(S.pantry.includes(i))return;const left=leftover(i,b,nm.id);if(left<q)miss.push({ing:i,qty:q-Math.max(0,left)})});return miss}

function fastForward(){S.plan.status='active';S.active=true;

function allOrders(){const out=restaurantOrders();if(S.plan)batches().forEach(b=>{if(S.gorders[b])out.push({key:'g:'+b,kind:'grocery',b,status:S.gorders[b].status,ref:S.gorders[b].ref})});

function orderSort(o){if(o.kind==='restaurant')return o.m.day*1440+submitAt(o.m);if(o.kind==='grocery'){const[a]=batchDays(o.b);return a*1440+480-600}return 1*1440+NOW.min+20}
/* ================= Navigation ================= */
const OB=['ob-profile','ob-body','ob-goal','ob-diet','ob-routine','ob-budget','ob-cooking','ob-method','ob-plan','ob-summary'];
const FULL=['welcome','signin','generating','activated',...OB];
function go(route,params={},opt={}){if(!opt.replace&&S.route!==route)S.stack.push({route:S.route,params:S.params});else if(!opt.replace)S.stack.push({route:S.route,params:S.params});
 S.route=route;S.params=params;S.sheet=null;if(route!=='meal')S.mTab='overview';render(true)}
function back(){const p=S.stack.pop();if(p){S.route=p.route;S.params=p.params}else S.route=S.active||S.plan?'home':'welcome';S.sheet=null;render(true)}
function tab(route){S.stack=[];S.route=route;S.params={};S.sheet=null;render(true)}
function toast(msg){S.toast=msg;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{S.toast=null;render()},3400)}
const isDesk=()=>S.view==='desktop'&&!document.body.classList.contains('narrow');

function hdr(title,o={}){const backBtn=o.back!==false?`<button class="iconbtn" data-act="back" aria-label="Back">${ic('chevL')}</button>`:'';
 return `<header class="hdr">${isDesk()&&o.back!==false&&!o.keepBack?`<button class="iconbtn" data-act="back" aria-label="Back">${ic('chevL')}</button>`:(isDesk()?'':backBtn)}<h1>${title}${o.sub?`<div class="sub">${o.sub}</div>`:''}</h1>${o.right||''}</header>`}

/* ================= Shell ================= */
function bottomNav(){const t=tabOf();const b=(r,i,l)=>`<button class="${t===r?'on':''}" data-act="tab" data-r="${r}">${ic(i)}<span>${l}</span></button>`;
 return `<nav class="bnav">${b('home','home','Home')}${b('plan','cal','My Plan')}<button class="ai ${t==='assistant'?'on':''}" data-act="tab" data-r="assistant"><div class="orb">${ic('spark')}</div><span>Assistant</span></button>${b('groceries','cart','Groceries')}${b('profile','user','Profile')}</nav>`}
function tabOf(){const r=S.route;if(['plan','meal','restaurants','review','authorize','history'].includes(r))return'plan';if(['orders','order','schedule','rules'].includes(r))return'home';if(['profile','prefs','integrations'].includes(r))return'profile';return r}
function sidebar(){const t=tabOf();const n=(r,i,l)=>`<button class="nav ${t===r?'on':''}" data-act="tab" data-r="${r}">${ic(i)}${l}</button>`;
 const up=S.active?allOrders().filter(o=>['scheduled','confirmed','processing','attention'].includes(o.status)).sort((a,b)=>orderSort(a)-orderSort(b)).slice(0,3):[];
 return `<aside class="side"><div class="logo">${LOGO(30)}NutriPilot</div>${n('home','home','Home')}${n('plan','cal','My Plan')}<button class="nav aibtn ${t==='assistant'?'on':''}" data-act="tab" data-r="assistant">${ic('spark')}Ask NutriPilot</button>${n('groceries','cart','Groceries')}${n('orders','truck','Orders')}${n('profile','user','Profile')}
 <div class="sep"></div><div class="mini"><div class="eyebrow">Coming up</div>${up.length?up.map(o=>`<button class="row" style="text-align:left" data-go="order" data-p="id=${o.key}"><span class="grow">${esc(orderTitle(o))}<br><span class="faint">${orderWhen(o)}</span></span>${badge(o.status)}</button>`).join(''):'<span class="faint">No scheduled orders yet.</span>'}</div>
 <div class="who"><div class="avatar">${esc(S.user.name[0]||'A')}</div><div class="grow"><b>${esc(S.user.name)}</b><div class="faint small">${esc(S.user.city)}, UAE</div></div></div></aside>`}
function appHTML(){const r=S.route;const full=FULL.includes(r);const fn=SCR[r]||SCR.home;let content='';try{content=fn()}catch(e){console.error(e);content=`<div class="page"><div class="callout err">${ic('alert')}<div>Screen error: ${esc(e.message)}</div></div></div>`}
 const ov=overlays();
 if(isDesk()){if(full)return `<div class="app desk ob"><main class="app-main" id="main"><div class="ob-card">${content}</div></main>${ov}</div>`;
  return `<div class="app desk">${sidebar()}<main class="app-main" id="main">${content}</main>${ov}</div>`}
 const sbar=`<div class="sbar"><span>11:40</span><span class="dots"><i style="height:5px"></i><i style="height:7px"></i><i style="height:9px"></i><i style="height:11px"></i>&nbsp;<svg width="24" height="12" viewBox="0 0 24 12"><rect x=".5" y=".5" width="20" height="11" rx="3" fill="none" stroke="currentColor"/><rect x="2" y="2" width="14" height="8" rx="1.5" fill="currentColor"/></svg></span></div>`;
 return `<div class="app mob">${sbar}<main class="app-main" id="main">${content}</main>${full||r==='assistant'?'':''}${full?'':bottomNav()}${ov}</div>`}

/* ================= Shared pieces ================= */
function thumb(m,cls=''){return `<div class="thumb ${cls}">${art(m.ref,PAL[m.ref])}</div>`}
function mealStatusBadge(m){if(m.status==='completed')return badge('completed');if(m.status==='skipped')return badge('skipped');
 if(!S.active)return `<span class="badge b-outline">Draft</span>`;
 if(m.mode==='ready'&&m.order)return badge(m.order.status);
 const prep=toMin(m.time)-(R[m.ref].prep+R[m.ref].cook)-10;return `<span class="badge b-outline">${R[m.ref].cook?`Start ${fmtT(prep)}`:'Ready to prep'}</span>`}
function mealCard(m,o={}){const x=mi(m);const cls=m.status==='skipped'?'skipped':m.status==='completed'?'done '+m.mode:m.mode;
 const typeB=m.mode==='home'?`<span class="badge b-brand">${ic('pot')}Home</span>`:`<span class="badge b-ready">${ic('bag')}Ready-made</span>`;
 const info=m.mode==='home'?`${ic('clock')}${R[m.ref].prep+R[m.ref].cook} min`:`${ic('truck')}${D[m.ref].eta}`;
 return `<button class="mcard ${cls}" data-go="meal" data-p="id=${m.id}">${thumb(m)}${m.status==='completed'?`<span class="tick">${ic('check')}</span>`:''}
 <div class="body"><div class="slot">${SLOTL[m.slot]} · ${fmtT(toMin(m.time))}${o.day?` · ${dShort(m.day)}`:''}</div><div class="name">${esc(x.name)}</div>
 <div class="meta"><span>${ic('flame')}<span class="num">${n0(x.kcal)}</span> kcal</span><span><b class="num">${n0(x.p)}g</b> protein</span><span class="num">${aed(x.total)}</span><span>${info}</span></div>
 <div class="foot">${typeB}${mealStatusBadge(m)}${m.mode==='ready'?`<span class="faint xs">${esc(D[m.ref].r)}</span>`:''}</div></div></button>`}
function ring(v,t,size=118,stroke=11,col='var(--brand)'){const r=(size-stroke)/2,c=2*Math.PI*r,p=clamp(v/t,0,1);
 return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--surface-3)" stroke-width="${stroke}" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${col}" stroke-width="${stroke}" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`}
function macro(l,v,t,u='g',col){return `<div class="macro"><div class="lbl"><span>${l}</span><span><b class="num">${n0(v)}</b> / <span class="num">${n0(t)}</span>${u}</span></div><div class="bar"><i style="width:${clamp(v/t*100,0,100)}%;${col?`background:${col}`:''}"></i></div></div>`}
function nutriCard(day,title){const t=targets();const x=dayTotals(day);const eaten=S.plan.meals.filter(m=>m.day===day&&m.status==='completed').reduce((a,m)=>a+mi(m).kcal,0);
 return `<div class="card"><div class="row between"><div><div class="eyebrow">${title||'Today\'s nutrition'}</div><div class="small muted" style="margin-top:2px">Planned vs target · estimates</div></div><button class="lnk small" data-act="sheet" data-t="nutrinfo">How we calculate</button></div>
 <div class="row" style="gap:18px;margin-top:12px;align-items:center"><div class="ringwrap">${ring(x.kcal,t.kcal)}<div class="c"><div><div class="big num">${n0(x.kcal)}</div><div class="xs faint">of ${n0(t.kcal)} kcal</div></div></div></div>
 <div class="grow stack" style="gap:9px">${macro('Protein',x.p,t.p,'g')}${macro('Carbs',x.c,t.c,'g','var(--lime)')}${macro('Fat',x.f,t.f,'g','var(--warn)')}${S.active&&day===NOW.day?`<div class="xs faint">${n0(eaten)} kcal eaten so far</div>`:''}</div></div></div>`}
function emptyState(icon,title,body,cta){return `<div class="empty"><div class="eico">${ic(icon)}</div><h3 style="font-size:17px;color:var(--ink)">${title}</h3><p class="small">${body}</p>${cta||''}</div>`}
function orderTitle(o){if(o.kind==='restaurant')return D[o.m.ref].n;if(o.kind==='grocery')return `Grocery delivery ${o.b.slice(1)}`;return 'Express grocery top-up'}
function orderWhen(o){if(o.kind==='restaurant')return `${dShort(o.m.day)} · arrives ${fmtT(toMin(o.m.time)-10)}`;if(o.kind==='grocery')return batchLabel(o.b);return `Today · ~35 min after approval`}
function orderPrice(o){if(o.kind==='restaurant'){const x=mi(o.m);return x.total+1.5}if(o.kind==='grocery')return batchTotal(o.b);return o.t.price}
function orderRow(o){const ico=o.kind==='restaurant'?'bag':'cart';return `<button class="list-row" data-go="order" data-p="id=${o.key}"><div class="act-row" style="padding:0;width:auto"><div class="ico" style="${o.kind!=='restaurant'?'background:var(--brand-soft);color:var(--brand-ink)':'background:var(--ready-soft);color:var(--ready)'}">${ic(ico)}</div></div>
 <div class="grow"><div style="font-weight:600">${esc(orderTitle(o))}</div><div class="small muted">${orderWhen(o)}</div>${o.kind==='restaurant'&&o.status==='scheduled'?`<div class="xs faint">Places at ${fmtT(submitAt(o.m))}</div>`:''}</div>
 <div style="text-align:right">${badge(o.status)}<div class="small num" style="margin-top:4px;font-weight:600">${aed(orderPrice(o),1)}</div></div></button>`}

/* ================= Onboarding ================= */
function obWrap(step,title,lede,body,o={}){const i=OB.indexOf(S.route);const ret=S.params.ret;
 return `<div class="ob"><div class="obtop"><button class="iconbtn" data-act="back" aria-label="Back">${ic('chevL')}</button><div class="prog"><i style="width:${(i+1)/OB.length*100}%"></i></div><span class="small faint num">${i+1}/${OB.length}</span>${o.skip&&!ret?`<button class="btn ghost" data-act="obnext">Skip</button>`:''}</div>
 <div class="obbody"><div><h1>${title}</h1>${lede?`<p class="lede">${lede}</p>`:''}</div>${body}</div>
 <div class="stickyfoot"><button class="btn primary block" data-act="obnext">${ret?'Save and return':o.cta||'Continue'}</button></div></div>`}
const chip=(path,val,label,cls='')=>{const arr=getPath(path);const on=Array.isArray(arr)?arr.includes(val):arr===val;return `<button class="chip ${cls} ${on?'on':''}" data-act="${Array.isArray(arr)?'toggle':'set'}" data-path="${path}" data-val="${esc(val)}">${on&&Array.isArray(arr)?ic('check'):''}${label||val}</button>`};
const scard=(path,val,t,d,icon)=>{const on=getPath(path)===val;return `<button class="scard ${on?'on':''}" data-act="set" data-path="${path}" data-val="${esc(val)}">${icon?`<div class="ico">${ic(icon)}</div>`:''}<div class="grow"><div class="t">${t}</div>${d?`<div class="d">${d}</div>`:''}</div><span class="radio">${on?ic('check'):''}</span></button>`};
const seg=(path,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${getPath(path)===v?'on':''}" data-act="set" data-path="${path}" data-val="${v}">${l}</button>`).join('')}</div>`;
const sw=(path)=>`<button class="switch ${getPath(path)?'on':''}" role="switch" aria-checked="${!!getPath(path)}" data-act="flip" data-path="${path}"></button>`;
function field(label,inner,hint){return `<div class="field"><label>${label}</label>${inner}${hint?`<div class="hint">${hint}</div>`:''}</div>`}

 <div class="grid2" style="margin-top:14px;grid-template-columns:repeat(3,1fr)"><div class="stat"><div class="v num">${n0(a.kcal)}</div><div class="l">avg kcal/day · target ${n0(t.kcal)}</div></div><div class="stat"><div class="v num">${n0(a.p)}g</div><div class="l">avg protein · target ${t.p}g</div></div><div class="stat"><div class="v num">${n0(c.total)}</div><div class="l">AED est. · budget ${n0(wb)}</div></div></div>
 <div style="margin-top:12px"><div class="bar split" style="height:10px"><i style="width:${c.grocery/wb*100}%;background:var(--brand)"></i><i style="width:${(c.restaurant+c.fees+c.other)/wb*100}%;background:var(--ready)"></i></div><div class="legend" style="margin-top:8px"><span><i style="background:var(--brand)"></i>Groceries ${aed(c.grocery)}</span><span><i style="background:var(--ready)"></i>Restaurants & fees ${aed(c.restaurant+c.fees+c.other)}</span><span><i style="background:var(--surface-3)"></i>Left ${aed(Math.max(0,wb-c.total))}</span></div></div>

 const strip=`<div class="days">${Array.from({length:p.days},(_,i)=>{const d=dDate(i);const ms=mealsOf(i);return `<button class="day ${i===day?'on':''} ${S.active&&i===NOW.day?'today':''}" data-act="selday" data-d="${i}"><span class="dw">${DOWS[d.getDay()]}</span><span class="dn num">${d.getDate()}</span><span class="pips">${ms.map(m=>`<i class="${m.status==='skipped'?'s':m.mode==='ready'?'r':''}"></i>`).join('')}</span></button>`}).join('')}</div>`;

 <div class="stack" style="gap:16px"><div class="card"><b>How scheduled purchases work</b><div style="margin-top:8px">${[['clock','Each order is placed at its scheduled time','Lunch orders 90 min ahead, dinner 45 min. You get a notification each time.'],['trendUp','When prices change','Increases within your tolerance go ahead. Larger increases pause the order and ask you.'],['swap','When an item is unavailable','We suggest a similar dish or product within your limits. Nothing is substituted silently.'],['shield','When extra approval is needed','Orders above your cap, or that would exceed a limit, wait for your one-tap approval.'],['lock','Payment verification','Careem may ask you to verify individual payments. Approving this plan doesn\'t skip that step.']].map(([i,t,d])=>`<div class="effect" style="padding:8px 0"><span class="ei" style="background:var(--surface-2)">${ic(i)}</span><div><b>${t}</b><div class="small muted">${d}</div></div></div>`).join('')}</div></div>

 const greet=`<div class="row between" style="padding:6px 0 2px"><div><div class="small muted">${S.active?'Monday, 9 November':dLong(0)}</div><h1 style="font-size:26px;margin-top:2px">Good morning, ${esc(u.name)}</h1><div class="row" style="gap:6px;margin-top:8px"><span class="badge b-lime">${ic('target')}${{lose:'Lose weight',gain:'Gain weight',maintain:'Maintain weight',healthier:'Eat healthier · maintain',protein:'More protein',habits:'Consistent habits'}[u.goal]}</span>${S.active?'':'<span class="badge b-outline">Plan in draft</span>'}</div></div><button class="iconbtn" data-act="sheet" data-t="notifs" aria-label="Notifications" style="position:relative">${ic('bell')}${att.length?'<span style="position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--err)"></span>':''}</button></div>`;

 if(s.type==='notifs'){const att=allOrders().filter(o=>o.status==='attention');return `${sheetHead('Notifications')}<div class="sb" style="gap:4px">${att.map(o=>`<button class="act-row" data-go="order" data-p="id=${o.key}"><div class="ico" style="background:var(--warn-soft);color:var(--warn)">${ic('alert')}</div><div class="grow"><div class="t">Approval needed</div><div class="d">${esc(orderTitle(o))}</div></div></button>`).join('')}${S.active?`<div class="act-row"><div class="ico" style="background:var(--brand-soft);color:var(--brand-ink)">${ic('check')}</div><div class="grow"><div class="t">Groceries delivered · 10:12 AM</div><div class="d">Delivery 1 for Mon–Wed</div></div></div><div class="act-row"><div class="ico">${ic('bag')}</div><div class="grow"><div class="t">Lunch order confirmed</div><div class="d">Chicken Tikka Rice Bowl arrives ~12:50 PM</div></div></div>`:'<p class="muted small">Nothing new.</p>'}</div>`}
 return ''}

function aiWelcome(){S.chat=[{from:'ai',type:'text',text:`Hi ${S.user.name}! I'm NutriPilot. I know your food preferences, goals and ${S.active?'active plan':'draft plan'}. What would you like to change or plan today?`}]}

 <div class="msgs" id="msgs"><div class="chat">${S.chat.map(chatMsg).join('')}${S.chatBusy?`<div class="bub ai typing"><i></i><i></i><i></i></div>`:''}

function chatMsg(m,i){if(m.from==='me')return `<div class="bub me">${esc(m.text)}</div>`;
 const head=`<div class="aihead"><span class="aiorb">${ic('spark')}</span>NutriPilot</div>`;
 if(m.type==='text')return `<div class="stack" style="gap:6px;align-self:flex-start;max-width:90%">${i===0||S.chat[i-1].from==='me'?head:''}<div class="bub ai">${m.text}</div>${m.quick?`<div class="qrs">${m.quick.map(q=>`<button class="qr" ${m.used?'disabled':''} data-act="qr" data-i="${i}" data-v="${esc(q)}">${q}</button>`).join('')}</div>`:''}</div>`;
 if(m.type==='error')return `<div class="stack" style="gap:6px;align-self:flex-start;max-width:90%">${head}<div class="bub ai err">${ic('alert')} ${m.text}</div><div class="qrs"><button class="qr" data-act="say" data-v="${esc(m.retry)}">Try again</button><button class="qr" data-go="integrations">Check connection</button></div></div>`;
 if(m.type==='recipe'){const r=R[m.ref],tm=meal(m.mealId);const nm={...tm,mode:'home',ref:m.ref};const miss=S.active&&batchLocked(batchOf(tm.day))?missingFor(nm):null;const p0=planCost(),p1=planCost(nm);
  return `<div class="rich"><div class="rhero">${art(m.ref,PAL[m.ref])}</div><div class="rb"><div class="row between"><span class="badge b-brand">${ic('pot')}Home cooked</span><span class="small muted">${r.prep+r.cook} min · ${r.diff}</span></div><b style="font-size:16px;font-family:var(--f-display)">${r.n}</b>
  <div class="grid2" style="grid-template-columns:repeat(4,1fr);gap:6px">${[['kcal',r.kcal],['protein',r.p+'g'],['carbs',r.c+'g'],['fat',r.f+'g']].map(([l,v])=>`<div style="background:var(--surface-2);border-radius:10px;padding:6px;text-align:center"><b class="num">${v}</b><div class="xs faint">${l}</div></div>`).join('')}</div>
  <div class="small"><b>Ingredients</b><div class="muted">${r.ings.map(([i,q])=>`${INGS[i].n} ${fmtQty(q,INGS[i].u)}`).join(' · ')}</div></div>
  <div class="callout ${miss&&miss.length?'warn':'ok'}" style="padding:8px 10px;font-size:12.5px">${ic('cart')}<div>${miss?(miss.length?`Need ${miss.map(x=>INGS[x.ing].n.toLowerCase()).join(', ')} · express top-up ${aed(missCost(miss)+7,1)} for your approval.`:'Everything is covered by Monday\'s grocery delivery.'):'Added to your next grocery delivery.'} Plan cost ${p1.total<p0.total?'drops':'rises'} by ${aed(Math.abs(p1.total-p0.total))}.</div></div>
  ${tm.order?`<div class="small muted">${ic('x')} Cancels the ${fmtT(submitAt(tm))} order from ${D[tm.ref].r}. Nothing charged yet.</div>`:''}
  ${m.done?`<div class="row"><span class="badge b-brand">${ic('check')}Confirmed</span><button class="lnk small" data-go="meal" data-p="id=${m.mealId}">View in My Plan</button></div>`:`<div class="row" style="gap:8px"><button class="btn primary sm grow" data-act="chatconfirm" data-i="${i}">Confirm change</button><button class="btn secondary sm" data-act="chatother" data-i="${i}">Another idea</button></div>`}</div></div>`}
 if(m.type==='options')return `<div class="stack" style="gap:8px;align-self:stretch">${head}<div class="bub ai">${m.text}</div>${m.items.map((it,j)=>{const x=it.mode==='home'?R[it.ref]:D[it.ref];return `<div class="rich" style="display:flex;gap:12px;padding:10px;align-items:center"><div class="thumb">${art(it.ref,PAL[it.ref])}</div><div class="grow" style="min-width:0"><b style="font-size:13.5px">${x.n}</b><div class="small muted">${it.mode==='home'?'Home · '+(x.prep+x.cook)+' min':x.r} · <span class="num">${x.kcal} kcal · ${x.p}g protein</span></div><div class="small num" style="font-weight:600">${it.mode==='home'?aed(recipeCost(x),1)+' est.':aed(x.price)}</div></div>${m.done===j?`<span class="badge b-brand">${ic('check')}Chosen</span>`:m.done!=null?'':`<button class="btn xs primary" data-act="chatpick" data-i="${i}" data-j="${j}">Choose</button>`}</div>`}).join('')}${m.done!=null?`<button class="lnk small" style="align-self:flex-start" data-go="meal" data-p="id=${m.mealId}">View in My Plan</button>`:''}</div>`;
 if(m.type==='swaps')return `<div class="stack" style="gap:8px;align-self:stretch">${head}<div class="bub ai">${m.text}</div><div class="rich"><div class="rb" style="gap:6px">${m.items.map(it=>{const tm=meal(it.id);return `<div class="kv"><span class="k">${dShort(tm.day)} ${SLOTL[tm.slot]}<div class="small" style="color:var(--ink)"><s class="faint">${esc(it.from)}</s> → <b>${esc(it.mode==='home'?R[it.ref].n:D[it.ref].n)}</b></div></span><span class="v small ${it.save>0?'delta-down':''}">${it.save?(it.save>0?'−':'+')+aed(Math.abs(it.save)):''}</span></div>`}).join('')}
  ${m.skippedNote?`<div class="small muted">${m.skippedNote}</div>`:''}${m.done?`<div class="row"><span class="badge b-brand">${ic('check')}Applied</span><button class="lnk small" data-act="tab" data-r="plan">Open My Plan</button></div>`:`<div class="row" style="gap:8px"><button class="btn primary sm grow" data-act="chatswaps" data-i="${i}">Apply ${m.items.length} change${m.items.length>1?'s':''}</button><button class="btn secondary sm" data-act="tab" data-r="plan">Pick myself</button></div>`}</div></div></div>`;
 if(m.type==='day'){const ms=mealsOf(m.day);const dt=dayTotals(m.day);return `<div class="stack" style="gap:8px;align-self:stretch">${head}<div class="bub ai">${m.text}</div><div class="rich"><div class="rb" style="gap:8px"><div class="row between"><b>${dLong(m.day)}</b><span class="small muted num">${n0(dt.kcal)} kcal · ${n0(dt.p)} g protein · ${aed(dt.cost)}</span></div>${ms.map(x=>`<button class="row" style="text-align:left" data-go="meal" data-p="id=${x.id}"><div class="thumb sm">${art(x.ref,PAL[x.ref])}</div><div class="grow"><div class="xs faint">${SLOTL[x.slot]} · ${fmtT(toMin(x.time))}</div><b class="small">${esc(mi(x).name)}</b></div>${x.mode==='home'?'<span class="badge b-brand">Home</span>':'<span class="badge b-ready">Ready</span>'}</button>`).join('')}<button class="btn secondary sm" data-act="openday" data-d="${m.day}">Open in My Plan</button></div></div></div>`}
 if(m.type==='orders'){const up=allOrders().filter(o=>!['delivered','cancelled'].includes(o.status)).sort((a,b)=>orderSort(a)-orderSort(b));const g=up.filter(o=>o.kind!=='restaurant');
  return `<div class="stack" style="gap:8px;align-self:stretch">${head}<div class="bub ai">${m.text}</div><div class="rich"><div class="rb" style="gap:0">${(m.grocery?g:up.slice(0,4)).map(orderRow).join('')||'<p class="small muted">No upcoming orders.</p>'}<button class="btn secondary sm" style="margin-top:10px" data-go="orders">All orders</button></div></div></div>`}
 return ''}
function aiPush(msg){S.chat.push(Object.assign({from:'ai'},msg))}
function say(text){text=text.trim();if(!text||S.chatBusy)return;S.chat.push({from:'me',text});S.chatBusy=true;render();scrollChat();setTimeout(()=>{S.chatBusy=false;respond(text);render();scrollChat()},850)}
function scrollChat(){requestAnimationFrame(()=>{const el=$('#msgs');if(el)el.scrollTop=el.scrollHeight})}
function respond(text){const t=text.toLowerCase();
 if(!S.plan){aiPush({type:'text',text:'You don\'t have a plan yet. Shall we build one? It takes about two minutes.',quick:['Start onboarding']});return}
 if(S.careem.outage&&/order|grocer|restaurant|deliver/.test(t)&&!/cook/.test(t)){aiPush({type:'error',text:'I couldn\'t reach Careem to check live orders. Your plan is safe and scheduled orders will retry automatically.',retry:text});return}
 const today=S.active?NOW.day:0;
 if(/cook|don.?t want to order|home.?cook|switch tonight/.test(t)){const din=S.plan.meals.find(m=>m.day===today&&m.slot==='dinner');
  if(!din){aiPush({type:'text',text:'You don\'t have a dinner planned today.'});return}
  if(din.mode==='home'){aiPush({type:'text',text:`Tonight's dinner is already home cooked: <b>${R[din.ref].n}</b>. Want something different?`,quick:['Under 15 minutes','15–30 minutes','30–45 minutes']});S.chatCtx={intent:'cook',id:din.id};return}
  aiPush({type:'text',text:`Sure. I can replace tonight's restaurant order (<b>${D[din.ref].n}</b> from ${D[din.ref].r}) with a home-cooked recipe. It hasn't been placed yet, so there's no charge. How much time do you have?`,quick:['Under 15 minutes','15–30 minutes','30–45 minutes']});S.chatCtx={intent:'cook',id:din.id};return}
 if(S.chatCtx&&S.chatCtx.intent==='cook'&&/minute|min/.test(t)){const ref=/under 15|15 min/.test(t)&&!/15–30/.test(t)?'skillet':/15–30/.test(t)?'lemonchicken':'fishcurry';const pick=compatible(R[ref])?ref:pickRecipe(meal(S.chatCtx.id),t);
  aiPush({type:'text',text:`Here's one that fits your ${S.user.maxCook}-minute limit, your protein goal and what's already in your kitchen.`});aiPush({type:'recipe',ref:pick,mealId:S.chatCtx.id});return}
 if(/budget|cheaper|reduce|save|spend/.test(t)){const cands=S.plan.meals.filter(m=>m.mode==='ready'&&m.status!=='completed'&&m.status!=='skipped'&&!(m.order&&['confirmed','processing'].includes(m.order.status))).sort((a,b)=>(D[b.ref].price+D[b.ref].fee)-(D[a.ref].price+D[a.ref].fee)).slice(0,2);
  const items=cands.map(m=>{const ref=pickRecipe(m,'cheap');return{id:m.id,mode:'home',ref,from:D[m.ref].n,save:Math.round(mi(m).total+1.5-recipeCost(R[ref]))}});const total=items.reduce((a,x)=>a+x.save,0);const pc=planCost();
  aiPush({type:'swaps',text:`Your plan is estimated at <b>${aed(pc.total+groceryTotal()-pc.grocery)}</b> against a ${aed(weekBudget())} weekly budget. Switching your two priciest upcoming restaurant meals to home cooking saves about <b>${aed(total)}</b>, with similar protein.`,items,skippedNote:'Today\'s lunch was already submitted, so I left it alone.'});return}
 if(/protein/.test(t)){const day=Math.min(today+1,S.plan.days-1);const lunch=S.plan.meals.find(m=>m.day===day&&m.slot==='lunch');if(!lunch){aiPush({type:'text',text:'No lunch planned tomorrow.'});return}
  const items=[{mode:'ready',ref:'mixedgrill'},{mode:'ready',ref:'salad'},{mode:'home',ref:'skillet'}].filter(x=>compatible(x.mode==='home'?R[x.ref]:D[x.ref])&&x.ref!==lunch.ref);
  aiPush({type:'options',text:`Here are high-protein lunches for ${dShort(day)}. Your current one, <b>${mi(lunch).name}</b>, has ${n0(mi(lunch).p)} g.`,items,mealId:lunch.id});return}
 if(/rice/.test(t)){const ms=S.plan.meals.filter(m=>m.day>=today&&m.day<today+3&&m.status!=='completed'&&m.status!=='skipped'&&!(m.order&&['confirmed','processing'].includes(m.order.status)));
  const items=[];ms.forEach(m=>{if(m.mode==='home'&&R[m.ref].ings.some(i=>i[0]==='basmati'||i[0]==='brownrice')){const ref=pickRecipe(m,'no rice');items.push({id:m.id,mode:'home',ref,from:R[m.ref].n,save:Math.round(recipeCost(R[m.ref])-recipeCost(R[ref]))})}
   if(m.mode==='ready'&&/rice/i.test(D[m.ref].n)){const ref=pickDish(m,'no rice');items.push({id:m.id,mode:'ready',ref,from:D[m.ref].n,save:Math.round(D[m.ref].price-D[ref].price)})}});
  if(!items.length){aiPush({type:'text',text:'Good news: none of your next three days\' meals include rice.'});return}
  aiPush({type:'swaps',text:`I found <b>${items.length} meals with rice</b> over the next three days. Here are rice-free swaps that keep your calories on target:`,items,skippedNote:S.active?'Today\'s lunch (Chicken Tikka Rice Bowl) is already with the restaurant, so I can\'t change it.':''});return}
 if(/next meal|replace/.test(t)){const nx=S.plan.meals.filter(m=>m.status!=='completed'&&m.status!=='skipped'&&(!S.active||m.day>today||(m.day===today&&toMin(m.time)>NOW.min))).sort((a,b)=>a.day*1440+toMin(a.time)-(b.day*1440+toMin(b.time)))[0];
  if(nx.mode==='ready'&&nx.order&&['confirmed','processing'].includes(nx.order.status)){aiPush({type:'text',text:`Your next meal (${D[nx.ref].n}) is already on its way, so I'd leave it. Want to change the one after?`,quick:['Yes, the one after']});return}
  const opts=nx.mode==='home'?homeOptions(nx.slot).filter(k=>k!==nx.ref).slice(0,3).map(ref=>({mode:'home',ref})):dishOptions().filter(k=>k!==nx.ref).slice(0,3).map(ref=>({mode:'ready',ref}));
  aiPush({type:'options',text:`Your next meal is <b>${mi(nx).name}</b> (${SLOTL[nx.slot].toLowerCase()} at ${fmtT(toMin(nx.time))}). Here are alternatives that keep you on track:`,items:opts,mealId:nx.id});return}
 if(/one after/.test(t)){aiPush({type:'text',text:'Tonight\'s dinner is next after that. Would you like to cook instead of ordering?',quick:['Yes, I want to cook tonight']});return}

 <div class="ds-sec"><h2>Spacing, radius, elevation</h2><div class="ds-grid"><div class="ds-demo"><div class="cap">Spacing · 4-pt scale</div>${[4,8,12,16,20,24,32].map(s=>`<div class="row"><span class="num small" style="width:28px">${s}</span><i style="display:block;height:10px;width:${s*4}px;background:var(--brand);border-radius:3px"></i></div>`).join('')}</div><div class="ds-demo"><div class="cap">Radius</div><div class="row wrap">${[['sm',10],['md',14],['lg',20],['xl',28]].map(([n,r])=>`<div style="width:56px;height:56px;border-radius:${r}px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center" class="xs">${n} ${r}</div>`).join('')}</div></div><div class="ds-demo"><div class="cap">Elevation</div><div class="row wrap" style="gap:14px">${[1,2,3].map(n=>`<div style="width:64px;height:56px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-${n});display:grid;place-items:center" class="xs">shadow-${n}</div>`).join('')}</div></div></div></div>
 <div class="ds-sec"><h2>Buttons & inputs</h2><div class="ds-grid"><div class="ds-demo"><div class="cap">Buttons</div><button class="btn primary">Primary</button><button class="btn secondary">Secondary</button><button class="btn dark">${ic('spark')}AI action</button><button class="btn danger">Destructive</button><button class="btn primary loading"><span class="spin"></span>Loading</button><button class="btn primary" disabled>Disabled</button><div class="row"><button class="btn primary sm">Small</button><button class="btn secondary xs">Extra small</button><button class="btn ghost">Ghost</button></div></div>
 <div class="ds-demo"><div class="cap">Inputs</div>${field('Default','<input class="input" value="Ahmed">')}${field('Error','<input class="input err" value="">','<span class="hint err">Add your name so we know what to call you.</span>')}${field('Disabled','<input class="input" disabled value="Sat 14 Nov">')}${field('With prefix','<div class="affix"><span class="pre">AED</span><input class="input has-pre" value="600"></div>')}<div class="row between"><span>Switch</span><span class="switch on"></span></div><div class="seg"><button class="on">Day</button><button>Week</button></div><input type="range" value="40"></div>
 <div class="ds-demo"><div class="cap">Chips & selection cards</div><div class="chips"><span class="chip on">${ic('check')}Indian</span><span class="chip">Arabic</span><span class="chip allergy on">Peanuts</span><span class="chip sm">Small</span></div><div class="scard on"><div class="ico">${ic('leaf')}</div><div class="grow"><div class="t">Eat healthier</div><div class="d">Selected state</div></div><span class="radio">${ic('check')}</span></div><div class="scard"><div class="ico">${ic('scale')}</div><div class="grow"><div class="t">Maintain weight</div><div class="d">Default state</div></div><span class="radio"></span></div></div></div></div>
 <div class="ds-sec"><h2>Status badges</h2><div class="ds-demo"><div class="row wrap">${Object.keys(STATUS).map(s=>badge(s)).join('')}<span class="badge b-brand">${ic('pot')}Home</span><span class="badge b-ready">${ic('bag')}Ready-made</span><span class="badge b-lime">High protein</span><span class="sample">Sample data</span></div></div></div>
 <div class="ds-sec"><h2>Meal cards</h2><div class="ds-grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${cards}</div><div class="legend"><span><i style="background:var(--brand)"></i>Home cooked</span><span><i style="background:var(--ready)"></i>Ready-made</span><span>Striped = skipped</span><span>Tick = completed</span></div></div>
 <div class="ds-sec"><h2>Commerce cards</h2><div class="ds-grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))"><div class="rest"><div class="thumb lg">${art('mixedgrill',PAL.mixedgrill)}</div><div class="grow stack" style="gap:4px"><div class="row between"><b>Mixed Grill Plate</b><b>AED 49</b></div><div class="small muted">Shawarma Yard · Al Quoz</div><div class="row wrap" style="gap:6px"><span class="badge b-lime">High protein</span><span class="badge b-brand">${ic('check')}Fits target</span></div></div></div>
 <div class="prodcard"><div class="pk" style="background:var(--warn-soft);color:var(--warn)">Royal<br><span style="font-size:10px">2 kg</span></div><div class="grow"><b>Sella Basmati Rice</b><div class="small muted">Royal Grain · 2 kg</div><div class="reqsel"><div>Recipes need<b>280 g</b></div><div>You'll get<b>1 × 2 kg</b></div></div></div></div>
 <div class="card">${nutriPreview()}</div></div></div>
 <div class="ds-sec"><h2>Feedback & overlays</h2><div class="ds-grid"><div class="ds-demo"><div class="cap">Callouts</div><div class="callout ok">${ic('check')}<div>Covered by Monday's delivery.</div></div><div class="callout info">${ic('info')}<div>Times depend on service availability.</div></div><div class="callout warn">${ic('alert')}<div>Order already submitted.</div></div><div class="callout err">${ic('alert')}<div>Can't reach Careem.</div></div></div>
 <div class="ds-demo" style="background:var(--surface-2)"><div class="cap">Bottom sheet</div><div class="sheet ds-static" style="position:relative;border-radius:22px;max-height:none;box-shadow:var(--shadow-2)"><div class="grab"></div><div class="sh"><h3>Skip this meal?</h3><span class="iconbtn">${ic('x')}</span></div><div class="sb"><div class="effect"><span class="ei" style="background:var(--info-soft);color:var(--info)">${ic('x')}</span><div class="small">The scheduled order will be cancelled.</div></div></div><div class="sf"><button class="btn secondary sm">Cancel</button><button class="btn danger sm grow">Skip meal</button></div></div></div>
 <div class="ds-demo" style="background:var(--surface-2)"><div class="cap">Dialog & toast</div><div class="modal ds-static" style="position:relative;left:auto;top:auto;width:100%"><div class="mi" style="background:var(--brand-soft);color:var(--brand)">${ic('cart')}</div><h3>Confirm grocery arrangement</h3><p class="small muted">2 deliveries · AED 182.50 · within your limit.</p><div class="row"><button class="btn secondary sm grow">Cancel</button><button class="btn primary sm grow">Confirm</button></div></div><div class="toast" style="position:relative;left:auto;right:auto;bottom:auto">${ic('check')}Plan updated</div></div>
 <div class="ds-demo"><div class="cap">AI conversation</div><div class="aihead"><span class="aiorb">${ic('spark')}</span>NutriPilot</div><div class="bub ai">How much time do you have tonight?</div><div class="qrs"><button class="qr">Under 15 minutes</button><button class="qr">15–30 minutes</button></div><div class="bub me" style="align-self:flex-end">15–30 minutes</div><div class="bub ai typing"><i></i><i></i><i></i></div></div>
 <div class="ds-demo"><div class="cap">Timeline & progress</div><div class="tl"><div class="st done"><span class="dot">${ic('check')}</span><div><div class="tt">Scheduled</div></div></div><div class="st done"><span class="dot">${ic('check')}</span><div><div class="tt">Submitted</div></div></div><div class="st cur"><span class="dot"></span><div><div class="tt">Restaurant confirmed</div></div></div><div class="st"><span class="dot"></span><div><div class="tt">Delivered</div></div></div></div><div class="bar"><i style="width:64%"></i></div><div class="bar warn"><i style="width:92%"></i></div></div>
 <div class="ds-demo"><div class="cap">Navigation</div><div style="border:1px solid var(--line);border-radius:16px;overflow:hidden"><div class="bnav" style="padding-bottom:8px"><button class="on">${ic('home')}<span>Home</span></button><button>${ic('cal')}<span>My Plan</span></button><button class="ai"><div class="orb">${ic('spark')}</div><span>Assistant</span></button><button>${ic('cart')}<span>Groceries</span></button><button>${ic('user')}<span>Profile</span></button></div></div><p class="small muted">Desktop uses a left sidebar with the same five destinations plus Orders.</p><div class="cap">Icons · 1.8px stroke, rounded</div><div class="row wrap" style="gap:12px">${['home','cal','spark','cart','user','pot','bag','truck','clock','flame','swap','skip','alert','shield','lock','card'].map(i=>ic(i)).join('')}</div></div></div></div>`}
function nutriPreview(){const t={kcal:2050,p:125,c:230,f:70};return `<div class="eyebrow">Nutrition summary</div><div class="row" style="gap:16px;margin-top:10px"><div class="ringwrap" style="width:96px;height:96px">${ring(1640,t.kcal,96,9)}<div class="c"><div><div class="big num" style="font-size:20px">1,640</div><div class="xs faint">kcal</div></div></div></div><div class="grow stack" style="gap:8px">${macro('Protein',104,t.p)}${macro('Carbs',170,t.c,'g','var(--lime)')}${macro('Fat',52,t.f,'g','var(--warn)')}</div></div>`}

/* ================= Render ================= */
let lastRoute='';
function render(resetScroll){document.body.classList.toggle('narrow',window.innerWidth<720);const root=$('#root');
 const main=$('#main');const st=main&&!resetScroll&&lastRoute===S.route+S.gTab?main.scrollTop:0;const ms=$('#msgs');const mst=ms?ms.scrollTop:0;
 const active=document.activeElement;const aid=active&&active.id;
 let h=demoBar();
 if(S.view==='ds')h+=`<div class="ds-wrap">${designSystem()}</div>`;
 else{const showGuide=S.view==='mobile'&&window.innerWidth>=1100;h+=`<div class="stage">${showGuide?`<aside class="guide">${guideHTML()}</aside>`:''}<div class="device ${S.view}">${appHTML()}</div></div>`}
 if(S.drawer||(document.body.classList.contains('narrow')&&S.drawer))h+=`<div class="drawer-scrim" data-act="drawer"></div><div class="drawer"><div class="row between" style="margin-bottom:14px"><b>Prototype controls</b><button class="iconbtn" data-act="drawer">${ic('x')}</button></div>${document.body.classList.contains('narrow')?`<div class="stack" style="margin-bottom:16px"><select class="dsel" id="jump2" style="max-width:none"><option value="">Jump to screen…</option>${SCREENS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select><div class="row"><label class="dtoggle"><button class="switch ${S.careem.outage?'on':''}" data-act="outage"></button>Careem outage</label><button class="dbtn" data-act="reset">${ic('refresh')}Reset</button></div></div>`:''}<div class="stack" style="gap:12px">${guideHTML()}</div></div>`;
 if(document.body.classList.contains('narrow'))h+=`<button class="fab-demo" data-act="drawer">Demo</button>`;
 root.innerHTML=h;lastRoute=S.route+S.gTab;
 const m2=$('#main');if(m2)m2.scrollTop=st;const ms2=$('#msgs');if(ms2)ms2.scrollTop=mst||ms2.scrollHeight;
 if(aid){const el=document.getElementById(aid);if(el&&el.tagName==='INPUT'&&el.type!=='range'){el.focus();try{const l=el.value.length;el.setSelectionRange(l,l)}catch(e){}}}}

/* ================= Events ================= */
document.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-act]');if(!el||el.disabled)return;
 if(el.tagName==='FORM')return;
 if(el.dataset.go){e.preventDefault();const p={};(el.dataset.p||'').split(';').filter(Boolean).forEach(kv=>{const i=kv.indexOf('=');p[kv.slice(0,i)]=kv.slice(i+1)});go(el.dataset.go,p);return}
 const f=ACTS[el.dataset.act];if(f){e.preventDefault();f(el.dataset,el)}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='composer'){const i=$('#chat-in');const v=i.value;i.value='';say(v)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ai-ins'){e.preventDefault();ACTS.airegen({id:S.sheet.id})}if(e.key==='Escape'&&(S.sheet||S.modal)){S.sheet=null;S.modal=null;render()}});
document.addEventListener('input',e=>{const el=e.target;const b=el.dataset.bind;if(!b)return;
 if(b.startsWith('body.')){const imp=S.user.units==='imperial';const v=parseFloat(el.value);if(isNaN(v))return;const k=b.split('.')[1];
  if(k==='weight')S.user.weight=imp?Math.round(v/2.2046*10)/10:v;if(k==='height')S.user.height=imp?Math.round(v*2.54):v;if(k==='target')S.user.targetWeight=imp?Math.round(v/2.2046):v;return}
 setPath(b,el.dataset.num?+el.value:el.value);if(el.dataset.live)liveOut();if(b==='user.name'&&S.obErr.name&&el.value.trim()){S.obErr={};}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='jump'||el.id==='jump2'){if(el.value){S.drawer=false;jumpTo(el.value)}return}
 if(el.dataset.bind&&el.dataset.rr)render()});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>render(),120)});

/* ================= Init ================= */
S=freshState();
render(true);
</script>
